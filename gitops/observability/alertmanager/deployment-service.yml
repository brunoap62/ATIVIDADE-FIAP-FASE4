apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      initContainers:
        - name: init-pagerduty-secret
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -f /etc/alertmanager/eso-secrets/PAGERDUTY_ROUTING_KEY ]; then
                cp /etc/alertmanager/eso-secrets/PAGERDUTY_ROUTING_KEY /etc/alertmanager/secrets/PAGERDUTY_ROUTING_KEY
              else
                printf "00000000000000000000000000000000" > /etc/alertmanager/secrets/PAGERDUTY_ROUTING_KEY
              fi
          volumeMounts:
            - name: eso-secrets
              mountPath: /etc/alertmanager/eso-secrets
              readOnly: true
            - name: alertmanager-secrets
              mountPath: /etc/alertmanager/secrets
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
            - name: alertmanager-secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: alertmanager-storage
              mountPath: /alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: eso-secrets
          secret:
            secretName: observability-secrets
            optional: true
        - name: alertmanager-secrets
          emptyDir: {}
        - name: alertmanager-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
