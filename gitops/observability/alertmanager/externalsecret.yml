apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-ssm-store
    kind: ClusterSecretStore
  target:
    name: observability-secrets
    creationPolicy: Owner
  data:
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: /observability/pagerduty_routing_key
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: /observability/discord_webhook_url
