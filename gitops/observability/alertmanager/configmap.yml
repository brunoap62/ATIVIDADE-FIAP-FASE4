apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # ============================================================================
    # Árvore de Roteamento com Prevenção de Alert Fatigue (Disciplina FIAP Fase 4)
    # ============================================================================
    route:
      # Agrupa alertas do mesmo serviço para evitar múltiplos chamados simultâneos
      group_by: ['alertname', 'service_name', 'namespace']
      # Aguarda 15s para consolidar alertas do mesmo grupo antes do primeiro envio
      group_wait: 15s
      # Intervalo para enviar novos alertas adicionados ao mesmo grupo
      group_interval: 1m
      # Evita Alert Fatigue: só reenvia o mesmo alerta se continuar ativo após 1h
      repeat_interval: 1h
      receiver: 'self-healing-and-ops'

    # Regras de Inibição (Inhibition): se um serviço estiver em estado crítico (5xx > 5%),
    # silencia alertas de warning secundários (ex: latência p95 alta) do mesmo serviço.
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['service_name', 'namespace']

    receivers:
      - name: 'self-healing-and-ops'
        # 1. Gerenciamento de Incidentes: PagerDuty Events API v2 (com Auto-Resolve)
        pagerduty_configs:
          - routing_key_file: '/etc/alertmanager/secrets/PAGERDUTY_ROUTING_KEY'
            send_resolved: true
            severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              service_name: '{{ .CommonLabels.service_name }}'
              namespace: '{{ .CommonLabels.namespace }}'
              runbook_id: '{{ .CommonLabels.runbook_id }}'
              description: '{{ .CommonAnnotations.description }}'
        # 2. Automação de Self-Healing (Runbook RB-001) + ChatOps no Discord
        webhook_configs:
          - url: 'http://self-healing-webhook.observability.svc.cluster.local:8080/webhook'
            send_resolved: true
