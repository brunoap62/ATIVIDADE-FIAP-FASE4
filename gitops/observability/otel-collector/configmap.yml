apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app: otel-collector
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      resource:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert
          - key: cluster.name
            value: toggle-master-eks
            action: upsert

      batch:
        send_batch_size: 1024
        timeout: 2s

    connectors:
      # Gera automaticamente os 4 Golden Signals (Traffic RPS, Errors 5xx, Latency p50/p90/p95/p99)
      # a partir dos Spans recebidos dos 5 microsserviços!
      spanmetrics:
        histogram:
          explicit:
            buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.route
          - name: rpc.system
        exemplars:
          enabled: true

      # Gera automaticamente as métricas de topologia (Service Map / Node Graph)
      # conectando evaluation-service -> flag/targeting -> auth-service e SQS -> analytics-service
      servicegraph:
        latency_histogram_buckets: [2ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s]
        dimensions:
          - http.method
          - http.status_code
        store:
          ttl: 5s
          max_items: 1000

    exporters:
      # Exporta métricas de aplicação, SpanMetrics (Golden Signals) e ServiceGraph para o Prometheus
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true
        resource_to_telemetry_conversion:
          enabled: true

      # Exporta Traces Distribuídos via OTLP gRPC para o Grafana Tempo (APM)
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true

      # Exporta Logs estruturados via OTLP HTTP para o Loki
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        tls:
          insecure: true

      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo, spanmetrics, servicegraph, debug]

        metrics:
          receivers: [otlp, spanmetrics, servicegraph]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki, debug]
