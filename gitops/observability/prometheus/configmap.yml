apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.observability.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      # 1. Coleta das métricas OTLP, SpanMetrics (Golden Signals) e ServiceGraph vindas do OTel Collector
      - job_name: 'otel-collector'
        scrape_interval: 5s
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      # 2. Auto-monitoramento do Prometheus e Alertmanager
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager.observability.svc.cluster.local:9093']

      # 3. Coleta de métricas de Saturação de Contêineres (CPU / Memória via Kubelet cAdvisor)
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # 4. Coleta de métricas do Kubelet (Status de Nós e Pods)
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

  alert_rules.yml: |
    groups:
      - name: togglemaster-golden-signals-alerts
        interval: 10s
        rules:
          # ====================================================================
          # Alerta Inteligente 1: Taxa de Erros HTTP 5xx > 5% (Aciona Self-Healing)
          # ====================================================================
          - alert: ToggleMasterHighErrorRate5xx
            expr: |
              (
                sum by (service_name) (rate(traces_spanmetrics_calls_total{http_status_code=~"5.."}[1m]))
                /
                clamp_min(sum by (service_name) (rate(traces_spanmetrics_calls_total[1m])), 0.0001)
              ) * 100 > 5
            for: 30s
            labels:
              severity: critical
              namespace: toggle-master
              self_healing: "true"
              runbook_id: "RB-001"
            annotations:
              summary: "🚨 Alta Taxa de Erros HTTP 5xx em {{ $labels.service_name }}"
              description: "O microsserviço {{ $labels.service_name }} apresenta {{ $value | printf \"%.2f\" }}% de erros HTTP 5xx (limite: 5%). Acionando incidente no PagerDuty/Discord e Runbook Automation RB-001 (kubectl rollout restart)."
              runbook_url: "https://github.com/brunoap62/ATIVIDADE-FIAP-FASE4/blob/main/RUNBOOKS.md#rb-001"

          # ====================================================================
          # Alerta Inteligente 2: Latência p95 Elevada (> 1000ms)
          # ====================================================================
          - alert: ToggleMasterHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le, service_name) (rate(traces_spanmetrics_latency_bucket[2m]))) > 1000
            for: 1m
            labels:
              severity: warning
              namespace: toggle-master
              runbook_id: "RB-002"
            annotations:
              summary: "⚠️ Latência p95 elevada em {{ $labels.service_name }}"
              description: "O percentil p95 de latência do serviço {{ $labels.service_name }} ultrapassou 1000ms (atual: {{ $value | printf \"%.0f\" }}ms)."
              runbook_url: "https://github.com/brunoap62/ATIVIDADE-FIAP-FASE4/blob/main/RUNBOOKS.md#rb-002"
